# ZannenSmolAir: Adafruit UF2 bootloader with SoftDevice S140 v7.3.0.
# MBR occupies 0x0-0x1000, S140 occupies 0x1000-0x27000, so the
# application partition must start at 0x27000 (see the board's
# bootloader: Adafruit_nRF52_Bootloader src/boards/zannensmolair_nrf52833).
bootloader:
  address: 0x0
  end_address: 0x27000
  region: flash_primary
  size: 0x27000
uf2_bootloader:
  address: 0x74000
  end_address: 0x80000
  region: flash_primary
  size: 0xc000
